<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Piper TTS test mk4</title>

<!-- Resolves the one bare import the vendored library needs internally.
     Pointing this at plain jsDelivr (not esm.sh) means no Node-compat shims,
     which avoids the "process.versions.node" misdetection bug. -->
<script type="importmap">
{
	"imports": {
		"onnxruntime-web/wasm": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.wasm.min.mjs"
	}
}
</script>
</head>
<body>
<h1>Piper TTS test mk4</h1>
<label for="voice">Voice:</label>
<select id="voice"></select>
<br><br>
<input id="text" type="text" size="50" value="Hello, this is a test of the Piper voice engine.">
<button id="go">Speak</button>
<button id="clear">Clear cached voices</button>
<pre id="log"></pre>

<script type="module">
	// Vendored, unmodified files - see ./vendor/. Loading these directly (not via
	// esm.sh) means no Node-compat polyfills get injected into their scope.
	import * as PiperTTS from "./vendor/piper-tts-web.js";

	const logEl = document.getElementById("log");
	function log(msg) {
		console.log(msg);
		logEl.textContent += msg + "\n";
	}

	// Pulled directly from this library version's own voice map (PATH_MAP in
	// piper-tts-web.js) - only voices listed there are actually usable here.
	const VOICES = {
		"English (en_GB)": [
			"en_GB-alan-low", "en_GB-alan-medium", "en_GB-alba-medium", "en_GB-aru-medium",
			"en_GB-cori-high", "en_GB-cori-medium", "en_GB-jenny_dioco-medium",
			"en_GB-northern_english_male-medium", "en_GB-semaine-medium",
			"en_GB-southern_english_female-low", "en_GB-vctk-medium",
		],
		"English (en_US)": [
			"en_US-amy-low", "en_US-amy-medium", "en_US-arctic-medium", "en_US-bryce-medium",
			"en_US-danny-low", "en_US-hfc_female-medium", "en_US-hfc_male-medium",
			"en_US-joe-medium", "en_US-john-medium", "en_US-kathleen-low",
			"en_US-kristin-medium", "en_US-kusal-medium", "en_US-l2arctic-medium",
			"en_US-lessac-high", "en_US-lessac-low", "en_US-lessac-medium",
			"en_US-libritts-high", "en_US-libritts_r-medium", "en_US-ljspeech-high",
			"en_US-ljspeech-medium", "en_US-norman-medium", "en_US-ryan-high",
			"en_US-ryan-low", "en_US-ryan-medium",
		],
		"Swedish (sv_SE)": [
			"sv_SE-nst-medium",
			"sv_SE-lisa-medium", // added to this vendored file's map - not in the npm package's original list
			"sv_SE-alma-medium", // added to this vendored file's map - not in the npm package's original list
		],
	};

	const SAMPLE_TEXT = {
		en: "Hello, this is a test of the Piper voice engine.",
		sv: "Hej, det här är ett test av rösten.",
	};

	const voiceSelect = document.getElementById("voice");
	const textInput = document.getElementById("text");
	for (const [groupLabel, ids] of Object.entries(VOICES)) {
		const group = document.createElement("optgroup");
		group.label = groupLabel;
		for (const id of ids) {
			const opt = document.createElement("option");
			opt.value = id;
			opt.textContent = id;
			group.appendChild(opt);
		}
		voiceSelect.appendChild(group);
	}
	voiceSelect.addEventListener("change", () => {
		textInput.value = voiceSelect.value.startsWith("sv_SE") ? SAMPLE_TEXT.sv : SAMPLE_TEXT.en;
	});
	textInput.value = SAMPLE_TEXT.en; // matches the first option (en_GB-alan-low)

	// The library's own default onnxWasm path (cdnjs, pinned to 1.18.0) is missing
	// a file its onnxruntime-web version needs - override it to match the version
	// pinned in the import map above.
	const wasmPaths = {
		...PiperTTS.TtsSession.WASM_LOCATIONS,
		onnxWasm: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/",
	};

	async function speak(label, text, voiceId) {
		try {
			log(`[${label}] creating session for voice "${voiceId}"...`);
			// TtsSession is a hard singleton internally - force a fresh one so it
			// actually reloads the model instead of reusing the last voice.
			PiperTTS.TtsSession._instance = null;
			const session = await PiperTTS.TtsSession.create({
				voiceId,
				wasmPaths,
				progress: (p) => log(`[${label}] downloading ${p.url} - ${Math.round(p.loaded * 100 / p.total)}%`),
			});
			log(`[${label}] session ready, synthesizing...`);
			const wav = await session.predict(text);
			const audio = new Audio(URL.createObjectURL(wav));
			await new Promise((resolve, reject) => {
				audio.onended = resolve;
				audio.onerror = reject;
				audio.play();
			});
			log(`[${label}] playing OK`);
		} catch (err) {
			log(`[${label}] FAILED: ${err}`);
			console.error(err);
		}
	}

	document.getElementById("go").addEventListener("click", async () => {
		logEl.textContent = "";
		const voiceId = voiceSelect.value;
		await speak(voiceId, textInput.value, voiceId);
	});

	document.getElementById("clear").addEventListener("click", async () => {
		logEl.textContent = "";
		log("Cached before clearing: " + JSON.stringify(await PiperTTS.stored()));
		await PiperTTS.flush();
		log("Cleared. Cached now: " + JSON.stringify(await PiperTTS.stored()));
	});
</script>
</body>
</html>
