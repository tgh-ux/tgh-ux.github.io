<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Piper TTS test</title>
</head>
<body>
<h1>Piper TTS test</h1>
<button id="go">Run test</button>
<pre id="log"></pre>

<script type="module">
	// Pin onnxruntime-web explicitly - the library's own default path is broken (see chat).
	import * as PiperTTS from "https://esm.sh/@mintplex-labs/piper-tts-web@1.0.5?deps=onnxruntime-web@1.19.2";

	const logEl = document.getElementById("log");
	function log(msg) {
		console.log(msg);
		logEl.textContent += msg + "\n";
	}

	// Override only the onnx runtime path; leave piperData/piperWasm at their library defaults.
	const wasmPaths = {
		...PiperTTS.TtsSession.WASM_LOCATIONS,
		onnxWasm: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/",
	};

	async function speak(label, text, voiceId) {
		try {
			log(`[${label}] creating session for voice "${voiceId}"...`);
			const session = await PiperTTS.TtsSession.create({
				voiceId,
				wasmPaths,
				progress: (p) => log(`[${label}] downloading ${p.url} - ${Math.round(p.loaded * 100 / p.total)}%`),
			});
			log(`[${label}] session ready, synthesizing...`);
			const wav = await session.predict(text);
			const audio = new Audio(URL.createObjectURL(wav));
			await audio.play();
			log(`[${label}] playing OK`);
		} catch (err) {
			log(`[${label}] FAILED: ${err}`);
			console.error(err);
		}
	}

	document.getElementById("go").addEventListener("click", async () => {
		logEl.textContent = "";
		await speak("English", "Hello, this is a test of the Piper voice engine.", "en_US-lessac-medium");
		await speak("Swedish", "Hej, det här är ett test av rösten.", "sv_SE-nst-medium");
	});
</script>
</body>
</html>
